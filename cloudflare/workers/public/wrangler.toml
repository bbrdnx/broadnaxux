name = "broadnaxux-public"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Static assets. Populated by `npm run prepare-assets` from the repo root.
# This is a multi-page static site; unknown paths return a default 404.
[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "broadnaxux-content"
database_id = "71f7a5bb-c05d-4325-8fac-fc2b8968f7f2"

[[r2_buckets]]
binding = "PUBLIC_BUCKET"
bucket_name = "broadnaxux-public"

[[r2_buckets]]
binding = "PRIVATE_BUCKET"
bucket_name = "broadnaxux-private"

[observability]
enabled = true

# Custom domain routing. The first deploy with these enabled will fail if
# the apex/www still have CNAME records pointing at Vercel — delete those in
# the Cloudflare DNS dashboard before redeploying.
[[routes]]
pattern = "barbarabroadnax.com"
custom_domain = true

[[routes]]
pattern = "www.barbarabroadnax.com"
custom_domain = true
