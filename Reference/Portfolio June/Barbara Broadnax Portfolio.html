  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ink);\n  font-size:clamp(2.3rem,5vw,4rem); line-height:1.02; letter-spacing:-0.035em; margin:0 0 26px;\n  text-wrap:balance;\n}\n.hero h1 .accent { color:var(--accent); }\n.hero h1 em { font-style:italic; font-weight:500; color:var(--ink-2); }\n.hero-lede { font-size:clamp(1rem,1.4vw,1.18rem); line-height:1.6; color:var(--ink-2); max-width:48ch; margin:0 0 30px; }\n.hero-meta { display:flex; flex-wrap:wrap; gap:10px 28px; }\n.hero-meta div { display:flex; flex-direction:column; gap:3px; }\n.hero-meta dt { font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); margin:0; }\n.hero-meta dd { font-size:14px; font-weight:500; color:var(--ink); margin:0; }\n\n.hero-portrait { position:relative; }\n.hero-portrait image-slot { width:100%; aspect-ratio:4/5; box-shadow:var(--sh-md); }\n.hero-portrait .frame-tag { position:absolute; left:14px; bottom:14px; font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:0.1em; color:var(--bg); background:rgba(5,51,74,.62); backdrop-filter:blur(4px); padding:5px 9px; border-radius:var(--r-sm); text-transform:uppercase; }\n\n/* ── Companies band ────────────────────────────────────── */\n.companies { padding:clamp(2.5rem,5vw,4rem) 0; border-top:1px solid var(--rule); }\n.companies-head { display:flex; align-items:baseline; justify-content:space-between; gap:1rem; margin-bottom:34px; }\n.companies-head p.note { font-size:13.5px; color:var(--muted); margin:0; max-width:30ch; text-align:right; }\n.co-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:0; }\n.co {\n  padding:28px 28px 28px 0; border-top:1px solid var(--rule); position:relative;\n}\n.co + .co { padding-left:28px; border-left:1px solid var(--rule); }\n.co-name { font-family:var(--display); font-weight:700; font-size:clamp(1.5rem,2.4vw,2rem); letter-spacing:-0.025em; margin:0 0 4px; }\n.co-name .reg { font-size:0.5em; vertical-align:super; color:var(--muted); font-weight:500; }\n.co-role { font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--accent-deep); margin:0 0 14px; }\n.co-industry { font-family:var(--mono); font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); margin:0 0 12px; }\n.co-desc { font-size:13.5px; line-height:1.6; color:var(--ink-2); margin:0; }\n\n/* ── Work ──────────────────────────────────────────────── */\n.work { padding:clamp(3rem,6vw,5rem) 0 clamp(2rem,4vw,3rem); border-top:1px solid var(--rule); }\n.work-head { display:flex; align-items:flex-end; justify-content:space-between; gap:1.5rem; margin-bottom:38px; flex-wrap:wrap; }\n.work-head h2 { font-family:var(--display); font-weight:700; font-size:clamp(1.7rem,3vw,2.4rem); letter-spacing:-0.03em; margin:10px 0 0; }\n.work-head .count { font-family:var(--mono); font-size:12px; color:var(--muted); }\n\n.work-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:clamp(1.25rem,2vw,1.75rem); }\n\n.case {\n  display:flex; flex-direction:column; background:var(--bg-card);\n  border:1px solid var(--rule); border-radius:var(--r-lg); overflow:hidden;\n  transition:transform var(--d3) var(--ease), border-color var(--d2), box-shadow var(--d2);\n}\n.case:hover { transform:translateY(-4px); border-color:var(--accent-line); box-shadow:var(--sh-md); }\n.case.feature { grid-column:1 / -1; flex-direction:row; }\n.case-figure { position:relative; background:var(--bg-2); overflow:hidden; }\n.case .case-figure { aspect-ratio:16/10; }\n.case.feature .case-figure { aspect-ratio:auto; flex:1 1 56%; min-height:340px; }\n.case-figure image-slot { width:100%; height:100%; }\n.case-figure .ph {\n  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;\n  font-family:var(--mono); font-size:11px; letter-spacing:0.08em; color:var(--muted); text-transform:uppercase;\n  pointer-events:none;\n}\n.case-badge { position:absolute; left:14px; top:14px; font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink); background:rgba(255,255,255,.86); backdrop-filter:blur(4px); padding:5px 9px; border-radius:var(--r-pill); border:1px solid var(--rule); }\n\n.case-body { display:flex; flex-direction:column; padding:22px 24px 24px; gap:0; }\n.case.feature .case-body { flex:1 1 44%; justify-content:center; padding:clamp(1.75rem,3vw,3rem); }\n.case-co { font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); margin:0 0 10px; }\n.case-title { font-family:var(--display); font-weight:700; font-size:1.35rem; letter-spacing:-0.02em; line-height:1.1; margin:0 0 14px; }\n.case.feature .case-title { font-size:clamp(1.7rem,2.6vw,2.3rem); margin-bottom:18px; }\n.case-outcome { display:flex; align-items:baseline; gap:9px; margin:0 0 18px; }\n.case-outcome .stat { font-family:var(--display); font-weight:700; font-size:1.05rem; letter-spacing:-0.02em; color:var(--accent-deep); }\n.case.feature .case-outcome .stat { font-size:1.5rem; }\n.case-outcome .lbl { font-size:13.5px; color:var(--ink-2); }\n.case-foot { display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:14px; border-top:1px solid var(--rule); gap:1rem; }\n.case-role { font-size:12.5px; color:var(--muted); }\n.case-link { display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:600; color:var(--ink); transition:color var(--d2); }\n.case-link .arr { transition:transform var(--d2) var(--ease); }\n.case:hover .case-link { color:var(--accent-deep); }\n.case:hover .case-link .arr { transform:translate(3px,-3px); }\n.case-tags { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 18px; }\n.case-tag { font-family:var(--mono); font-size:10px; font-weight:500; letter-spacing:0.04em; color:var(--ink-2); background:var(--bg-2); border:1px solid var(--rule); padding:4px 9px; border-radius:var(--r-sm); }\n\n/* ── Side projects (smaller, dark) ─────────────────────── */\n.side { margin-top:clamp(3rem,6vw,5rem); background:var(--ink); color:var(--bg); padding:clamp(3rem,6vw,4.5rem) 0; }\n.side-head { display:flex; align-items:flex-end; justify-content:space-between; gap:1.5rem; flex-wrap:wrap; margin-bottom:30px; }\n.side-head .l h2 { font-family:var(--display); font-weight:700; font-size:clamp(1.5rem,2.6vw,2rem); letter-spacing:-0.025em; margin:12px 0 0; color:var(--bg); }\n.side-head .l .eyebrow { color:var(--accent); }\n.side-head .r { font-size:14px; line-height:1.6; color:rgba(251,248,241,.7); max-width:38ch; margin:0; }\n.side-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }\n.spc {\n  display:flex; align-items:center; gap:18px; padding:20px 22px;\n  background:var(--ink-dark); border:1px solid var(--rule-dark); border-radius:var(--r-md);\n  transition:border-color var(--d2), transform var(--d2) var(--ease);\n}\n.spc:hover { border-color:var(--accent-line); transform:translateY(-2px); }\n.spc-mark { width:46px; height:46px; flex-shrink:0; border-radius:var(--r-sm); background:linear-gradient(135deg, #0A4862, var(--ink-dark)); border:1px solid var(--rule-dark); display:flex; align-items:center; justify-content:center; font-family:var(--display); font-weight:700; font-size:15px; color:var(--bg); }\n.spc .m { flex:1; min-width:0; }\n.spc-live { display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-size:9.5px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--accent); margin-bottom:5px; }\n.spc-live .d { width:5px; height:5px; border-radius:50%; background:var(--accent); box-shadow:0 0 7px var(--accent); }\n.spc-name { font-family:var(--display); font-weight:600; font-size:1.05rem; letter-spacing:-0.015em; margin:0 0 2px; color:var(--bg); }\n.spc-desc { font-size:12.5px; line-height:1.45; color:rgba(251,248,241,.6); margin:0; }\n.spc .arr { color:rgba(251,248,241,.4); transition:transform var(--d2) var(--ease), color var(--d2); font-size:16px; }\n.spc:hover .arr { color:var(--accent); transform:translate(3px,-3px); }\n\n/* ── Contact / footer ──────────────────────────────────── */\n.contact { padding:clamp(3.5rem,7vw,6rem) 0; }\n.contact-in { display:grid; grid-template-columns:1.4fr 1fr; gap:clamp(2rem,5vw,4rem); align-items:end; }\n.contact h2 { font-family:var(--display); font-weight:700; font-size:clamp(2rem,4.5vw,3.4rem); letter-spacing:-0.035em; line-height:1.02; margin:18px 0 0; text-wrap:balance; }\n.contact h2 a { color:var(--accent); text-decoration:none; border-bottom:2px solid transparent; transition:border-color var(--d2); }\n.contact h2 a:hover { border-color:var(--accent); }\n.contact-links { display:flex; flex-direction:column; gap:2px; }\n.contact-links a { display:flex; align-items:center; justify-content:space-between; padding:15px 2px; border-top:1px solid var(--rule); font-size:15px; font-weight:500; color:var(--ink); transition:padding-left var(--d2) var(--ease), color var(--d2); }\n.contact-links a:last-child { border-bottom:1px solid var(--rule); }\n.contact-links a:hover { padding-left:8px; color:var(--accent-deep); }\n.contact-links a .arr { color:var(--muted); transition:transform var(--d2) var(--ease), color var(--d2); }\n.contact-links a:hover .arr { transform:translate(3px,-3px); color:var(--accent); }\n\n.foot { border-top:1px solid var(--rule); padding:24px 0 40px; display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap; }\n.foot p { font-family:var(--mono); font-size:11.5px; color:var(--muted); margin:0; letter-spacing:0.03em; }\n.foot .foot-links { display:flex; gap:20px; }\n.foot .foot-links a { font-size:12.5px; color:var(--muted); transition:color var(--d1); }\n.foot .foot-links a:hover { color:var(--accent); }\n\n/* ── Entrance motion ───────────────────────────────────── */\n.reveal { opacity:0; transform:translateY(16px); transition:opacity var(--d3) var(--ease), transform var(--d3) var(--ease); }\n.reveal.in { opacity:1; transform:none; }\n@media (prefers-reduced-motion:reduce) {\n  .reveal { opacity:1 !important; transform:none !important; }\n  .hero-status .dot { animation:none; }\n}\n\n/* ── Responsive ────────────────────────────────────────── */\n@media (max-width:900px) {\n  .hero-grid { grid-template-columns:1fr; gap:2.5rem; }\n  .hero-portrait { max-width:360px; }\n  .co-grid { grid-template-columns:1fr; }\n  .co + .co { padding-left:0; border-left:none; }\n  .work-grid { grid-template-columns:1fr; }\n  .case.feature { flex-direction:column; }\n  .case.feature .case-figure { min-height:240px; }\n  .side-grid { grid-template-columns:1fr; }\n  .contact-in { grid-template-columns:1fr; align-items:start; }\n}\n@media (max-width:600px) {\n  .nav-links { gap:16px; }\n  .nav-links a.hide-sm { display:none; }\n  .companies-head p.note { display:none; }\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"progress\" id=\"progress\"><\u002Fdiv>\n\n<!-- NAV ============================================================= -->\n<header class=\"nav\">\n  <a href=\"#top\" class=\"brand\" aria-label=\"Barbara Broadnax, home\">\n    <b>BARBARA<\u002Fb>\n    <b>BROADNAX<\u002Fb>\n    <span class=\"brand-tag\">Design · AI · Strategy<\u002Fspan>\n  <\u002Fa>\n  <nav class=\"nav-links\">\n    <a href=\"#work\" class=\"on\">Work<\u002Fa>\n    <a href=\"#companies\" class=\"hide-sm\">Companies<\u002Fa>\n    <a href=\"#building\" class=\"hide-sm\">Building<\u002Fa>\n    <a href=\"#contact\" class=\"nav-cta\">Get in touch<\u002Fa>\n  <\u002Fnav>\n<\u002Fheader>\n\n<main id=\"top\">\n\n  <!-- HERO ========================================================== -->\n  <section class=\"hero\">\n    <div class=\"wrap hero-grid\">\n      <div class=\"hero-text reveal\">\n        <div class=\"hero-status\"><span class=\"dot\"><\u002Fspan><span>Open to senior &amp; lead roles<\u002Fspan><\u002Fdiv>\n        <h1>Senior product designer turning complex, regulated products into <span class=\"accent\">measurable outcomes.<\u002Fspan><\u002Fh1>\n        <p class=\"hero-lede\">Eight years across legal tech, commercial aviation, and e-commerce. I pair human-centered design with AI fluency to ship work that performs, <em>and I can prove it.<\u002Fem><\u002Fp>\n        <dl class=\"hero-meta\">\n          <div><dt>Based<\u002Fdt><dd>Phoenix, AZ · Remote<\u002Fdd><\u002Fdiv>\n          <div><dt>Now<\u002Fdt><dd>Alaska Airlines<\u002Fdd><\u002Fdiv>\n          <div><dt>Focus<\u002Fdt><dd>Product · AI · Accessibility<\u002Fdd><\u002Fdiv>\n        <\u002Fdl>\n      <\u002Fdiv>\n      <div class=\"hero-portrait reveal\">\n        <image-slot id=\"headshot\" shape=\"rounded\" radius=\"14\" placeholder=\"Drop your headshot\" fit=\"cover\"><\u002Fimage-slot>\n        <span class=\"frame-tag\">Barbara Broadnax<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- COMPANIES ===================================================== -->\n  <section class=\"companies\" id=\"companies\">\n    <div class=\"wrap\">\n      <div class=\"companies-head reveal\">\n        <p class=\"eyebrow\">The companies<\u002Fp>\n        <p class=\"note\">Three industries, each with its own constraints, regulations, and high-stakes users.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"co-grid\">\n        <div class=\"co reveal\">\n          <h3 class=\"co-name\">IPRO<\u002Fh3>\n          <p class=\"co-role\">Product Designer<\u002Fp>\n          <p class=\"co-industry\">Legal technology<\u002Fp>\n          <p class=\"co-desc\">Enterprise e-discovery software that helps legal teams review and produce millions of documents in litigation and investigations.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"co reveal\">\n          <h3 class=\"co-name\">Alaska Airlines<\u002Fh3>\n          <p class=\"co-role\">Lead Product Designer<\u002Fp>\n          <p class=\"co-industry\">Commercial aviation<\u002Fp>\n          <p class=\"co-desc\">A major U.S. carrier serving tens of =\"spc-name\">MTRCD — WCAG Guide<\u002Fh3>\n            <p class=\"spc-desc\">An accessibility reference built as a product design exercise, not a prompt exercise.<\u002Fp>\n          <\u002Fdiv>\n          <span class=\"arr\">↗<\u002Fspan>\n        <\u002Fa>\n        <a href=\"#\" class=\"spc reveal\">\n          <div class=\"spc-mark\">L<\u002Fdiv>\n          <div class=\"m\">\n            <span class=\"spc-live\"><span class=\"d\"><\u002Fspan>Live<\u002Fspan>\n            <h3 class=\"spc-name\">The Lez List<\u002Fh3>\n            <p class=\"spc-desc\">Connecting Black lesbians and queer women to events and experiences, by us, for us.<\u002Fp>\n          <\u002Fdiv>\n          <span class=\"arr\">↗<\u002Fspan>\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- CONTACT ======================================================= -->\n  <section class=\"contact\" id=\"contact\">\n    <div class=\"wrap contact-in\">\n      <div class=\"reveal\">\n        <p class=\"eyebrow\">Let's talk<\u002Fp>\n        <h2>Hiring for a senior or lead design role? <a href=\"mailto:broadnaxux@gmail.com\">Let's talk.<\u002Fa><\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"contact-links reveal\">\n        <a href=\"mailto:broadnaxux@gmail.com\">broadnaxux@gmail.com <span class=\"arr\">↗<\u002Fspan><\u002Fa>\n        <a href=\"#\">LinkedIn <span class=\"arr\">↗<\u002Fspan><\u002Fa>\n        <a href=\"#\">Download resume <span class=\"arr\">↓<\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"wrap\">\n      <div class=\"foot\">\n        <p>© 2026 Barbara Broadnax · Phoenix, AZ<\u002Fp>\n        <div class=\"foot-links\">\n          <a href=\"#work\">Work<\u002Fa>\n          <a href=\"#contact\">Contact<\u002Fa>\n          <a href=\"#\">Resume<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fmain>\n\n<script src=\"9ff650c5-d6f1-4584-8c74-b4b8ece58b2f\"><\u002Fscript>\n<script>\n  // Scroll progress\n  const prog = document.getElementById('progress');\n  const onScroll = () => {\n    const h = document.documentElement;\n    const pct = (h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight)) * 100;\n    prog.style.width = pct + '%';\n  };\n  window.addEventListener('scroll', onScroll, { passive: true });\n  onScroll();\n\n  // Staggered entrance reveals\n  const io = new IntersectionObserver((entries) => {\n    entries.forEach((e, i) => {\n      if (e.isIntersecting) {\n        const el = e.target;\n        const sibs = Array.from(el.parentElement.querySelectorAll(':scope > .reveal'));\n        const idx = Math.max(0, sibs.indexOf(el));\n        el.style.transitionDelay = (idx * 70) + 'ms';\n        el.classList.add('in');\n        io.unobserve(el);\n      }\n    });\n  }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });\n  document.querySelectorAll('.reveal').forEach(el => io.observe(el));\n\n  // Active nav link on scroll\n  const sections = ['work', 'companies', 'building', 'contact'].map(id => document.getElementById(id)).filter(Boolean);\n  const links = Array.from(document.querySelectorAll('.nav-links a'));\n  const spy = new IntersectionObserver((entries) => {\n    entries.forEach(e => {\n      if (e.isIntersecting) {\n        links.forEach(l => l.classList.toggle('on', l.getAttribute('href') === '#' + e.target.id && !l.classList.contains('nav-cta')));\n      }\n    });\n  }, { threshold: 0.4 });\n  sections.forEach(s => spy.observe(s));\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
